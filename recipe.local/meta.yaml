package:
  name: spectacoular
  version: "{{ environ.get('VERSION') }}"

source:
  path: ..

build:
  noarch: python
  script: python -m pip install --no-deps -vv .

requirements:
  host:
    - python
    - pip
    - hatchling
    - wheel
  run:
    - python >=3.11,<3.15
    - acoular >=26.01
    - bokeh >=3.0
    - python-sounddevice

test:
  # Python imports

  files:
    - apps

  imports:
    - spectacoular

about:
  home: https://acoular.org/spectacoular/
  license: BSD License
  summary: 'Library for SpectAcoular interactive applications with Acoular'

